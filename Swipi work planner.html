</style></head><body><div id="app"></div><div id="mo"></div><div id="toast"></div>
<script>
const LS='swipi_planner_v1',TZ='Asia/Jakarta',CAP=360;
const TYPES=['Iklan / Ads','Konten Instagram Feed','Instagram Story','Artikel','Proposal','Engagement','Follow akun','Upload produk','Paid promote','Laporan','Tugas lainnya'];
const DUR=[120,60,20,75,30,4,2,20,60,120,30],dl=t=>t==5||t==6;
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P={ck:'M5 12l4 4 10-10',pl:'M12 5v14M5 12h14',ed:'M4 20h4L19 9l-4-4L4 16z',tr:'M5 7h14M9 7V4h6v3M7 7l1 13h8l1-13',ch:'M15 6l-6 6 6 6',cr:'M9 6l6 6-6 6'};
const ic=n=>`<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="${P[n]}"/></svg>`;
const today=()=>new Date().toLocaleDateString('sv-SE',{timeZone:TZ}),pd=s=>new Date(s+'T00:00:00Z'),wd=d=>pd(d).getUTCDay();
const fd=(s,o)=>pd(s).toLocaleDateString('id-ID',{timeZone:'UTC',...o});
const mlabel=mk=>fd(mk+'-01',{month:'long',year:'numeric'});
const shift=(mk,n)=>{const[y,m]=mk.split('-').map(Number);return new Date(Date.UTC(y,m-1+n,1)).toISOString().slice(0,7)};
const wdays=mk=>{const[y,m]=mk.split('-').map(Number),r=[];for(let d=1;d<=31;d++){const t=new Date(Date.UTC(y,m-1,d));if(t.getUTCMonth()!=m-1)break;const w=t.getUTCDay();if(w>0&&w<6)r.push(mk+'-'+String(d).padStart(2,'0'))}return r};
const fmt=n=>n>=60?`${Math.floor(n/60)}j ${n%60}m`:`${n}m`,lvl=p=>p<.45?'Ringan':p<=.85?'Normal':'Padat';
let S,view='dash',calMode='Minggu',mk=today().slice(0,7),sel,MB=[];
function seed(){const B=[['Bintang Florist Express',[['Google Ads',0,1],['Meta Ads',0,1],['Instagram feed post',1,6],['Artikel',3,6],['Laporan bulanan',9,1]]],['Alvadespro',[['Proposal Upwork',4,6],['Meta Ads',0,1],['Laporan bulanan',9,1]]],['alvaagency.ai',[['Likes dan comments pada akun target',5,60],['Follow akun niche relevan',6,60],['Instagram feed post',1,6],['Instagram Story',2,6]]],['Tayyib & Co.',[['Instagram feed post',1,6],['Instagram Story',2,6]]],['rapihin.skripsi',[['Instagram feed post',1,6],['Paid promote',8,1]]],['privee.bag',[['Instagram feed post',1,12],['Upload produk ke Shopee',7,12]]]];
 const s={brands:[],tasks:[],months:{}};B.forEach(([n,ts])=>{const id=uid();s.brands.push({id,name:n});ts.forEach(([title,type,target])=>s.tasks.push({id:uid(),b:id,title,type,target,dur:DUR[type]}))});return s}
try{S=JSON.parse(localStorage.getItem(LS))}catch(e){}if(!S||!S.brands)S=seed();
const save=()=>{try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}};
const getM=k=>S.months[k]||(S.months[k]={prog:{},off:{},snap:{},plan:[]});
const snap=t=>{const b=S.brands.find(x=>x.id==t.b);return b?{b:b.name,title:t.title,type:t.type,target:t.target,dur:t.dur}:null};
function sync(k){const m=getM(k);if(k<today().slice(0,7))return m;S.tasks.forEach(t=>{const used=m.plan.some(i=>i.t==t.id)||m.prog[t.id],s=snap(t);if(s&&(!m.snap[t.id]||!used))m.snap[t.id]=s});
 Object.keys(m.snap).forEach(id=>{if(!S.tasks.some(t=>t.id==id)&&!m.prog[id]&&!m.plan.some(i=>i.t==id))delete m.snap[id]});return m}
const defSel=k=>{const W=wdays(k),td=today();return W.includes(td)?td:W.find(d=>d>=td)||W[0]};sel=defSel(mk);
function toast(t){const e=$('#toast');e.textContent=t;e.className='on';clearTimeout(toast.h);toast.h=setTimeout(()=>e.className='',3200)}
function modal(t,body,btns){MB=btns;$('#mo').innerHTML=`<div class=mb><h3>${t}</h3>${body}<div class=ma>${btns.map((b,i)=>`<button class="btn ${b.c||''}" data-m=${i}>${b.t}</button>`).join('')}</div></div>`;$('#mo').className='on'}
const stt=(m,id,td,k)=>{const s=m.snap[id],p=m.prog[id]||0;if(p>=s.target)return'Selesai';if(k<td.slice(0,7)||m.plan.some(i=>i.t==id&&i.d<i.q&&i.date<td))return'Terlambat';return p>0?'Berjalan':'Belum mulai'};
function setItem(m,i,d){const s=m.snap[i.t];m.prog[i.t]=Math.max(0,Math.min(s.target,(m.prog[i.t]||0)+d-i.d));i.d=d;save()}
function setProg(m,id,v){const s=m.snap[id];v=Math.max(0,Math.min(s.target,Math.round(v)||0));let x=v-(m.prog[id]||0);const its=m.plan.filter(i=>i.t==id).sort((a,b)=>a.date<b.date?-1:1);
 if(x>0){for(const i of its){const k=Math.min(x,i.q-i.d);i.d+=k;x-=k;if(!x)break}}else for(const i of its.reverse()){const k=Math.min(-x,i.d);i.d-=k;x+=k;if(!x)break}
 m.prog[id]=v;save()}
function gen(k,keep){const m=getM(k),td=today(),D=wdays(k).filter(d=>d>=td);
 m.plan=m.plan.filter(i=>m.snap[i.t]&&(i.d>0||(keep&&i.date<td)));
 S.tasks.forEach(t=>{const s=snap(t);if(s)m.snap[t.id]=s});
 Object.keys(m.snap).forEach(id=>{if(!S.tasks.some(t=>t.id==id)&&!m.prog[id]&&!m.plan.some(i=>i.t==id))delete m.snap[id]});
 if(!D.length){save();return toast('Tidak ada hari kerja tersisa.')}
 const n=D.length,load={};D.forEach(d=>load[d]=0);m.plan.forEach(i=>{if(load[i.date]!=null)load[i.date]+=(i.q-i.d)*m.snap[i.t].dur});
 const ids=Object.keys(m.snap).filter(id=>!m.off[id]).sort((a,b)=>{const A=m.snap[a],B=m.snap[b];return(dl(B.type)?1:0)-(dl(A.type)?1:0)||B.dur*B.target-A.dur*A.target});
 let ad=0,rp=0,kk=0;
 ids.forEach(id=>{const s=m.snap[id],rem=s.target-(m.prog[id]||0)-m.plan.filter(i=>i.t==id).reduce((a,i)=>a+i.q-i.d,0);if(rem<=0)return;kk++;
  const put=(ix,q)=>{ix=Math.max(0,Math.min(n-1,ix));const c=q*s.dur;let b=null;
   for(let o=0;o<n&&b==null;o++)for(const x of o?[ix+o,ix-o]:[ix])if(x>=0&&x<n&&load[D[x]]+c<=CAP){b=x;break}
   if(b==null)b=D.reduce((a,_,x)=>load[D[x]]<load[D[a]]?x:a,0);
   load[D[b]]+=c;m.plan.push({id:uid(),t:id,date:D[b],q,d:0})};
  if(dl(s.type)||rem>n){const b=Math.floor(rem/n),e=rem%n;for(let x=0;x<n;x++){const q=b+Math.floor((x+1)*e/n)-Math.floor(x*e/n);if(q>0)put(x,q)}}
  else for(let i=0;i<rem;i++){let ix=Math.floor((i+.5)*n/rem);if(rem==1){if(s.type==0||s.type==8)ix=1+ad++;else if(s.type==9)ix=n-1-rp++}else ix+=kk%2;put(ix,1)}});
 save();sel=defSel(k);toast('Jadwal disusun.')}
const dayMin=(m,d)=>m.plan.filter(i=>i.date==d&&m.snap[i.t]&&!m.off[i.t]).reduce((a,i)=>a+i.q*m.snap[i.t].dur,0);

function dash(){const m=sync(mk),td=today(),W=wdays(mk),ids=Object.keys(m.snap).filter(id=>!m.off[id]);
 let tot=0,dn=0;const c={Selesai:0,Berjalan:0,'Belum mulai':0,Terlambat:0};
 ids.forEach(id=>{const s=m.snap[id];tot+=s.target;dn+=Math.min(m.prog[id]||0,s.target);c[stt(m,id,td,mk)]++});
 const pct=tot?Math.round(dn/tot*100):0,act=m.plan.filter(i=>m.snap[i.t]&&!m.off[i.t]),late=act.filter(i=>i.d<i.q&&i.date<td);
 const pm=act.filter(i=>i.d<i.q&&i.date>=td).reduce((a,i)=>a+(i.q-i.d)*m.snap[i.t].dur,0),room=W.filter(d=>d>=td).length*CAP;
 const irow=i=>{const s=m.snap[i.t],done=i.d>=i.q,p=m.prog[i.t]||0,w=i.q>1;return`<div class="tl${w?' w':''}${done?' dn':''}" style="--c:${tone(s.b)}"><div class=tp><div><span class=tc>${TS[s.type]}</span><b style="margin-top:8px">${esc(s.title)}</b><small>Bulan ini ${p}/${s.target} · ${fmt(i.q*s.dur)}</small></div>${w?`<div class=ct>${i.d}/${i.q}</div>`:''}</div>${w?(i.q<=12?`<div class=dots>${Array.from({length:i.q},(_,x)=>`<u class="${x<i.d?'f':''}"></u>`).join('')}</div>`:''):''}<div class=rb>${i.q>1&&!done?`<button class=ib data-a=inc data-i=${i.id} title="Tambah 1">${ic('pl')}</button>`:''}<button class="ib${done?' on':''}" data-a=tog data-i=${i.id} title="${done?'Batalkan':'Selesai'}">${ic('ck')}</button><button class=ib data-a=edi data-i=${i.id} title="Ubah">${ic('ed')}</button></div></div>`};
 const dl_=act.filter(i=>i.date==sel),g={};dl_.forEach(i=>(g[m.snap[i.t].b]||(g[m.snap[i.t].b]=[])).push(i));
 const mn=dayMin(m,sel),lv=lvl(mn/CAP);
 const wk=d=>Math.floor((Math.round((pd(d)-pd(W[0]))/864e5)+(wd(W[0])+6)%7)/7);
 const rows=[...new Set(W.map(wk))].map(r=>[1,2,3,4,5].map(w=>W.find(d=>wk(d)==r&&wd(d)==w)));
 const shown=calMode=='Minggu'?rows.filter(r=>r.includes(sel)):rows;
 const cell=d=>{if(!d)return'<i></i>';const it=act.filter(i=>i.date==d),pc=dayMin(m,d)/CAP;return`<button class="cd${d==sel?' sel':''}${d==td?' td':''}" data-a=day data-d=${d}><b>${+d.slice(8)}</b><small>${it.length} tugas</small></button>`};
 const byB={};ids.forEach(id=>(byB[m.snap[id].b]||(byB[m.snap[id].b]=[])).push(id));
 return`<div class=dv><div class="card hero"><div class=top><div><small>Progres bulan ini</small><div class=big>${pct}%</div></div><button class="btn pri" data-a=gen ${mk<td.slice(0,7)?'disabled':''}>Generate Schedule</button></div>${bar(pct)}<div class=stats><div><b>${c.Selesai}</b><small>Selesai</small></div><div><b>${c.Berjalan}</b><small>Berjalan</small></div><div><b>${c['Belum mulai']}</b><small>Belum mulai</small></div><div><b>${c.Terlambat}</b><small>Terlambat</small></div></div></div>
 ${!act.length&&ids.length?`<div class=al>Belum ada jadwal. Tekan Generate Schedule.</div>`:''}
 ${late.length?`<div class=al><b>${late.length} tugas terlambat</b>${late.slice(0,6).map(i=>`<div class=row><div class=rm><b>${esc(m.snap[i.t].title)}</b><small>${esc(m.snap[i.t].b)} · ${fd(i.date,{day:'numeric',month:'short'})} · sisa ${i.q-i.d}</small></div><div class=rb>${W.includes(td)?`<button class=btn data-a=mv data-i=${i.id}>Pindah ke hari ini</button>`:''}<button class=ib data-a=edi data-i=${i.id} title="Ubah">${ic('ed')}</button></div></div>`).join('')}</div>`:''}
 ${pm>room&&room>0?`<div class=al>Beban melebihi kapasitas bulan ini (${fmt(pm)} dari ${fmt(room)}). Kurangi target di Kelola tugas.</div>`:''}
 <div class="card focus"><div class=top><div><h3>${sel==td?'Hari ini, ':''}${fd(sel,{weekday:'long',day:'numeric',month:'long'})}</h3><small>Beban ${lv.toLowerCase()} · ${fmt(mn)} dari ${fmt(CAP)}</small></div>${sel!=td&&W.includes(td)?`<button class=btn data-a=day data-d=${td}>Hari ini</button>`:''}</div>${bar(Math.min(100,Math.round(mn/CAP*100)))}
 ${dl_.length?Object.entries(g).map(([b,l])=>`<div class=bx style="--bx:${bxc(b)}"><div class=bk style="--c:${tone(b)}"><i></i><small>${esc(b)}</small></div><div class=tg>${l.map(irow).join('')}</div></div>`).join(''):`<p class=mu>Tidak ada tugas${sel==td?' hari ini':''}.</p>`}</div>
 <div class=card><div class=top><h3>Kalender</h3><button class=btn data-a=cal>${calMode=='Minggu'?'Bulan':'Minggu'}</button></div><div class=cal>${['Sen','Sel','Rab','Kam','Jum'].map(x=>`<small>${x}</small>`).join('')}${shown.flat().map(cell).join('')}</div></div>
 ${Object.entries(byB).map(([b,l])=>{const T=l.reduce((a,id)=>a+m.snap[id].target,0),Dn=l.reduce((a,id)=>a+Math.min(m.prog[id]||0,m.snap[id].target),0),pc=Math.round(Dn/T*100);
 return`<div class="card bc" style="--c:${tone(b)};--bx:${bxc(b)}"><div class=bh><h3 class=bk><i></i>${esc(b)}</h3><small>${Dn}/${T} · ${pc}%</small></div>${bar(pc)}<div class=tg>${l.map(id=>{const s=m.snap[id],p=m.prog[id]||0,st=stt(m,id,td,mk);return`<div class="tl rw" style="--c:${tone(b)}"><div class=tp><div><b>${esc(s.title)}</b><small>${p}/${s.target} · ${Math.round(p/s.target*100)}%${st=='Selesai'||st=='Terlambat'?' · '+st:''}</small></div></div><div class=rb>${s.target==1?`<button class="ib${p>=1?' on':''}" data-a=tt data-t=${id} title="Selesai">${ic('ck')}</button>`:`<button class=ib data-a=ti data-t=${id} title="Tambah 1">${ic('pl')}</button><button class=ib data-a=tp data-t=${id} title="Ubah progres">${ic('ed')}</button>`}</div></div>`}).join('')}</div></div>`}).join('')}</div>`}
function kelola(){const m=sync(mk);return`<div class=top><div><h2>Kelola tugas</h2><small>Kolom Aktif berlaku untuk ${mlabel(mk)}</small></div><button class="btn pri" data-a=ab>Tambah brand</button></div>
 ${S.brands.map(b=>`<div class=card><div class=bh><input class=in data-f=bn data-id=${b.id} value="${esc(b.name)}"><button class=ib data-a=db data-id=${b.id} title="Hapus brand">${ic('tr')}</button></div>
 ${S.tasks.filter(t=>t.b==b.id).map(t=>`<div class=kt><label>Judul<input class=in data-f=tt data-id=${t.id} value="${esc(t.title)}"></label><label>Jenis<select data-f=ty data-id=${t.id}>${TYPES.map((x,i)=>`<option value=${i} ${i==t.type?'selected':''}>${x}</option>`).join('')}</select></label><label>Target<input type=number min=1 data-f=tg data-id=${t.id} value=${t.target}></label><label>Menit<input type=number min=1 data-f=du data-id=${t.id} value=${t.dur}></label><label class=sw><input type=checkbox data-f=ac data-id=${t.id} ${m.off[t.id]?'':'checked'}>Aktif</label><button class=ib data-a=dt data-id=${t.id} title="Hapus tugas">${ic('tr')}</button></div>`).join('')}
 <div style="margin-top:12px"><button class=btn data-a=at data-id=${b.id}>Tambah tugas</button></div></div>`).join('')}
 <small>Data tersimpan di browser ini dan tidak ikut pindah perangkat.</small>`}
const R=()=>{$('#app').innerHTML=head()+(view=='dash'?dash():kelola())};
const fi=id=>getM(mk).plan.find(x=>x.id==id);
const A={nav:d=>{view=d.v;R()},mo:d=>{mk=shift(mk,+d.n);sel=defSel(mk);R()},day:d=>{sel=d.d;R()},cal:()=>{calMode=calMode=='Minggu'?'Bulan':'Minggu';R()},
 gen:()=>{const m=sync(mk),td=today(),ex=m.plan.some(i=>i.d<i.q);if(!ex){gen(mk,false);return R()}
  const late=m.plan.filter(i=>i.d<i.q&&i.date<td).length;
  modal('Susun ulang jadwal?',`<p class=mu>Progres tetap aman. Sisa target dijadwalkan ulang mulai hari ini.${late?` ${late} tugas terlambat.`:''}</p>`,[{t:'Batal'},...(late?[{t:'Pertahankan terlambat',f:()=>{gen(mk,true);R()}}]:[]),{t:'Jadwalkan ulang',c:'pri',f:()=>{gen(mk,false);R()}}])},
 inc:d=>{const m=getM(mk),i=fi(d.i);setItem(m,i,Math.min(i.q,i.d+1));R()},
 tog:d=>{const m=getM(mk),i=fi(d.i);setItem(m,i,i.d>=i.q?0:i.q);R()},
 mv:d=>{fi(d.i).date=today();save();R()},
 ti:d=>{const m=getM(mk),id=d.t,p=m.prog[id]||0;if(p>=m.snap[id].target)return;const it=m.plan.filter(i=>i.t==id&&i.d<i.q).sort((a,b)=>a.date<b.date?-1:1)[0];it?setItem(m,it,it.d+1):setProg(m,id,p+1);R()},
 tt:d=>{const m=getM(mk),id=d.t;setProg(m,id,(m.prog[id]||0)>=m.snap[id].target?0:m.snap[id].target);R()},
 tp:d=>{const m=getM(mk),s=m.snap[d.t];modal('Ubah progres',`<p class=mu>${esc(s.title)}</p><label>Selesai dari ${s.target}<input id=mv type=number min=0 max=${s.target} value=${m.prog[d.t]||0}></label>`,[{t:'Batal'},{t:'Simpan',c:'pri',f:()=>{setProg(m,d.t,+$('#mv').value);R()}}])},

 const a=e.target.closest('[data-a]');if(a&&!a.disabled)A[a.dataset.a](a.dataset)});

 if(f=='bn'){const b=S.brands.find(x=>x.id==id);b.name=v.trim()||b.name}
 else{const t=S.tasks.find(x=>x.id==id);

 save();R()});
