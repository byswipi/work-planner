<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="theme-color" content="#F5F2EC">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Swipi Daily</title>

<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F2EC;--sf:#FBFAF7;--ink:#0F0A1A;--mut:#5E566E;--line:rgba(15,10,26,.12);--acc:#7A63FF;--on:#fff;--tint:rgba(122,99,255,.14);--tint2:rgba(122,99,255,.5);--over:rgba(15,10,26,.18);--bd:rgba(15,10,26,.22)}
@media(prefers-color-scheme:dark){:root{--bg:#0F0A1A;--sf:#1B1330;--ink:#F5F2EC;--mut:#B4ADC4;--line:rgba(245,242,236,.12);--acc:#A99CFF;--on:#0F0A1A;--tint:rgba(169,156,255,.16);--tint2:rgba(169,156,255,.55);--over:rgba(245,242,236,.2);--bd:rgba(245,242,236,.28)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 'Instrument Sans',system-ui,sans-serif}
h1,h2,h3{margin:0;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:700;letter-spacing:-.03em;line-height:1.1}
h1,h2{font-size:24px}h3{font-size:18px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
main,.wrap{max-width:520px;margin:auto;padding:16px 20px calc(96px + env(safe-area-inset-bottom))}
.wrap{padding-top:32px;padding-bottom:40px}
.card{background:var(--sf);border:1px solid var(--line);border-radius:22px;padding:16px;margin:0 0 12px}
.btn{min-height:44px;padding:0 20px;border:1px solid var(--acc);border-radius:99px;background:var(--acc);color:var(--on);font-weight:600}
.btn:active{opacity:.85}
.btn.alt,.btn.sun{background:transparent;color:var(--ink);border-color:var(--bd)}
.btn.ghost,.btn.link{background:none;border-color:transparent;color:var(--mut)}
.btn.link{text-decoration:underline;padding:0 4px}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
small,.mut{color:var(--mut);font-size:14px}
ul{list-style:none;margin:0;padding:0}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;min-height:44px}
.dn{display:flex;align-items:center}
.dn button{width:44px;height:44px;border:0;background:none;font-size:24px;color:var(--mut)}
.sum{display:flex;justify-content:space-between;align-items:baseline}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0 12px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px}
.bar.over i{background:var(--mut)}
.note{border-left:3px solid var(--acc);padding:8px 14px;margin:0 0 12px;font-size:15px;background:var(--sf);border-radius:0 12px 12px 0}
.row{display:flex;align-items:center;gap:4px;padding:8px 0;border-bottom:1px solid var(--line)}
.ck{width:44px;height:44px;flex:none;border:0;background:none;position:relative}
.ck::before{content:'';position:absolute;inset:10px;border:2px solid var(--bd);border-radius:50%}
.done .ck::before{background:var(--acc);border-color:var(--acc)}
.done .ck::after{content:'✓';position:absolute;inset:0;display:grid;place-items:center;color:var(--on);font-size:14px}
.done b{text-decoration:line-through;color:var(--mut);font-weight:500}
.st{display:flex;align-items:center;gap:2px;font-size:14px;white-space:nowrap;color:var(--mut)}
.st button{width:36px;height:36px;border-radius:50%;border:1px solid var(--bd);background:transparent;font-weight:600}
.day{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 0 2px}
.day.now span{color:var(--acc);font-weight:600}
.empty{text-align:center;padding:56px 0}
nav#nav{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--line);display:flex;justify-content:center;padding:4px 8px calc(4px + env(safe-area-inset-bottom))}
nav#nav button{flex:1;max-width:140px;min-height:52px;border:0;background:none;color:var(--mut);display:grid;place-items:center}
nav#nav button[aria-current=page]{color:var(--acc)}
.f{display:flex;flex-direction:column;gap:4px;margin:0 0 12px}
.f label{font-size:14px;font-weight:600}
input,select{min-height:44px;padding:0 12px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--ink);font-size:16px;width:100%}
dialog{background:var(--sf);color:var(--ink);border:1px solid var(--line);border-radius:22px;max-width:520px;width:calc(100% - 24px);padding:16px;max-height:92vh}
dialog::backdrop{background:rgba(15,10,26,.55)}
.tr{border:1px solid var(--line);border-radius:14px;padding:10px;margin:0 0 10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#toast{position:fixed;left:12px;right:12px;bottom:calc(70px + env(safe-area-inset-bottom));max-width:496px;margin:auto;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px;display:none;z-index:9}
.err{color:var(--ink);font-weight:600;min-height:24px}
details{margin:12px 0}summary{cursor:pointer;font-weight:600;min-height:44px;display:flex;align-items:center}
pre{background:var(--sf);border:1px solid var(--line);border-radius:12px;padding:10px;overflow-x:auto;font-size:13px}
.big{font-size:34px;font-weight:700;line-height:1;letter-spacing:-.02em}
.wk{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.wk.h{margin:16px 0 6px;text-align:center}
.wk.h small{font-size:12px;font-weight:600;text-transform:none}
.cell{position:relative;overflow:hidden;aspect-ratio:1/1.12;min-height:56px;border:1px solid var(--line);border-radius:14px;background:var(--sf);padding:5px 7px;display:flex;flex-direction:column;justify-content:space-between;text-align:left}
.cell i{position:absolute;left:0;right:0;bottom:0;display:block}
.cell .p{background:var(--tint)}
.cell .d{background:var(--tint2)}
.cell.over .p{background:var(--over)}
.cell>span,.cell>small{position:relative}
.cell .n{font-weight:600;font-size:15px}
.cell small{font-size:11px;line-height:1}
.cell.now .n{color:var(--acc);font-weight:700}
.cell.miss{border-style:dashed;border-color:var(--mut)}
.cell.sel{border:2px solid var(--ink)}
.cell.off{background:transparent;color:var(--mut)}
.lg{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0 16px}
.lg span{display:inline-flex;align-items:center;gap:6px}
.lg i{width:12px;height:12px;border-radius:3px;display:inline-block}
.dl li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.dl li:last-child{border:0}
.dl .ok b{color:var(--mut);text-decoration:line-through;font-weight:500}
.ic{width:44px;height:44px;border:0;background:none;color:var(--mut);display:grid;place-items:center;border-radius:50%}
dialog>.between:first-child{position:sticky;top:-16px;background:var(--sf);padding:8px 0;z-index:1}
@media(prefers-reduced-motion:no-preference){.bar i,.cell i{transition:width .3s,height .3s}}
</style></head>
<body>

<p id="ld" class="wrap mut">Memuat...</p>
<div id="auth" class="wrap" hidden>
 <h1>Swipi Daily.</h1>
 <p class="mut">Masuk untuk membuka jadwal kerjamu.</p>
 <div class="card">
  <div class="f"><label for="em">Email</label><input id="em" type="email" autocomplete="email" inputmode="email"></div>
  <div class="f"><label for="pw">Kata sandi</label><input id="pw" type="password" autocomplete="current-password"></div>
  <div class="f"><label for="rm">Kode ruang</label><input id="rm" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="contoh: swipi-egi"><small>Jadwalmu tersimpan di ruang ini. Pakai kode yang sama di semua perangkat.</small></div>
  <p class="err" id="autherr" role="alert"></p>
  <button class="btn" data-a="login">Masuk</button>
 </div>
 <button class="btn link" data-a="local">Coba mode lokal tanpa login</button>
</div>

<div id="app" hidden>
 <main id="v"></main>
 <nav id="nav" aria-label="Menu utama"></nav>
</div>
<dialog id="dlg" aria-label="Atur brand"></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-auth-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-firestore-compat.min.js"></script>
<script>
/* Isi sekali dari Firebase: Project settings, Your apps, firebaseConfig */
const FIREBASE_CONFIG={apiKey:'ISI_API_KEY',authDomain:'ISI.firebaseapp.com',projectId:'ISI',appId:'ISI'};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const rp=n=>'Rp '+Math.round(n).toLocaleString('id-ID');
const dur=m=>{m=Math.round(m);const h=Math.floor(m/60),r=m%60;return h?(r?h+'j '+r+'m':h+'j'):r+'m'};
const fd=(s,o)=>new Date(s+'T00:00:00').toLocaleDateString('id-ID',o);
const ls=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lset=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const today=()=>iso(new Date());
let S,ref,auth,db,room='',local=false,tab='today',sel=today(),cur,saveT,email='';

const PRESET={Post:60,Story:20,Artikel:90,'Meta Ads':90,'Google Ads':90,Laporan:60,Like:.5,Komen:1.5,Follow:.5,Lainnya:30};
function defaults(){
 const P=(b,l,t)=>({id:b+'-'+l.toLowerCase().replace(/\W/g,''),brand:b,label:l,target:t,min:PRESET[l]});
 return{month:today().slice(0,7),cap:360,
  brands:[{id:'alva',name:'alvaagency',c:'#FF5A5F',pool:'A',fee:0},{id:'tay',name:'tayyib & co.',c:'#2EC4A0',pool:'A',fee:0},{id:'flo',name:'bintang florist express',c:'#FF9F1C',pool:'',fee:1600000},{id:'rap',name:'rapihin.skripsi',c:'#4D96FF',pool:'',fee:0},{id:'sw',name:'swipi ventures',c:'#9B5DE5',pool:'',fee:0},{id:'desp',name:'alvadespro',c:'#F15BB5',pool:'A',fee:0}],
  pools:{A:{name:'Paket agensi',fee:2000000}},
  tasks:[P('alva','Post',6),P('alva','Story',6),P('alva','Like',60),P('alva','Komen',60),P('alva','Follow',60),P('alva','Laporan',1),
   P('tay','Post',6),P('tay','Story',6),
   P('flo','Post',6),P('flo','Artikel',6),P('flo','Meta Ads',1),P('flo','Google Ads',1),P('flo','Laporan',1),
   P('rap','Post',12),P('sw','Post',12),
   P('desp','Post',6),P('desp','Meta Ads',1),P('desp','Laporan',1)],
  base:{},done:{},plan:{},gen:''};
}
const tk=id=>S.tasks.find(t=>t.id===id);
const br=id=>S.brands.find(b=>b.id===id)||{name:'?',c:'#999'};
const logs=id=>Object.values(S.done).reduce((a,d)=>a+(d[id]||0),0);
const doneTot=id=>Math.max(0,(S.base[id]||0)+logs(id));
const rem=t=>Math.max(0,t.target-doneTot(t.id));
const work=b=>S.tasks.filter(t=>t.brand===b.id).reduce((a,t)=>a+t.target*t.min,0);
function feeOf(b){
 if(b.pool&&S.pools[b.pool]){const tot=S.brands.filter(x=>x.pool===b.pool).reduce((a,x)=>a+work(x),0);return tot?S.pools[b.pool].fee*work(b)/tot:0}
 return b.fee||0;
}
function workdays(m,from){
 const o=[],[y,mo]=m.split('-').map(Number),d=new Date(from+'T00:00:00');
 while(d.getFullYear()===y&&d.getMonth()===mo-1){const w=d.getDay();if(w&&w<6)o.push(iso(d));d.setDate(d.getDate()+1)}
 return o;
}
function lines(d){
 const o={...(S.plan[d]||{})},dn=S.done[d]||{};
 for(const id in dn)o[id]=Math.max(o[id]||0,dn[id]);
 const bi=id=>S.brands.findIndex(b=>b.id===tk(id).brand);
 return Object.keys(o).filter(tk).sort((a,b)=>bi(a)-bi(b)).map(id=>({id,q:o[id],d:dn[id]||0,t:tk(id)}));
}
function replan(){
 const t0=today(),days=workdays(S.month,t0),D=days.length,P={};
 for(const d in S.plan)if(d<t0)P[d]=S.plan[d];
 if(D){
  days.forEach(d=>P[d]={});
  const load=days.map(d=>Object.entries(S.done[d]||{}).reduce((a,[id,n])=>a+(tk(id)?tk(id).min*n:0),0));
  const ts=S.tasks.map(t=>({t,r:rem(t)})).filter(x=>x.r>0).sort((a,b)=>b.t.min*b.r-a.t.min*a.r);
  for(const{t,r}of ts){
   const late=/laporan/i.test(t.label),cnt={};
   for(let k=0;k<r;k++){
    const a=late?D-1:Math.floor(k*D/r),b=late?D-1:Math.max(a,Math.floor((k+1)*D/r)-1);
    let best=a;for(let i=a;i<=b;i++)if(load[i]<load[best])best=i;
    load[best]+=t.min;cnt[best]=(cnt[best]||0)+1;
   }
   for(const i in cnt)P[days[i]][t.id]=cnt[i];
  }
  if(days[0]===t0)for(const[id,n]of Object.entries(S.done[t0]||{}))if(n>0&&tk(id))P[t0][id]=(P[t0][id]||0)+n;
 }
 S.plan=P;S.gen=t0;
}
function newMonth(){S.month=today().slice(0,7);S.base={};S.done={};S.plan={};replan()}

function save(){
 clearTimeout(saveT);
 saveT=setTimeout(()=>{
  if(local)lset('swipi_local',JSON.stringify(S));
  else ref.set(S).catch(e=>toast('Gagal menyimpan: '+e.code+'. Cek aturan Firestore.'));
 },400);
}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',4200)}
function show(id){$('#ld').hidden=true;['auth','app'].forEach(x=>$('#'+x).hidden=x!==id);if(id==='auth'&&!$('#rm').value)$('#rm').value=ls('swipi_room')||''}
const cleanRoom=v=>String(v||'').trim().toLowerCase().replace(/[^a-z0-9_-]/g,'');

/* ---------- tampilan ---------- */
let msel=null;
const atur=`<button class="ic" data-a="settings" aria-label="Pengaturan" title="Pengaturan"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg></button>`;
function vToday(){
 const L=lines(sel),mt=L.reduce((a,l)=>a+l.q*l.t.min,0),md=L.reduce((a,l)=>a+Math.min(l.d,l.q)*l.t.min,0),p=mt?md/mt:0;
 const isT=sel===today(),n=L.filter(l=>l.d>=l.q).length;
 const days=workdays(S.month,today()),remMin=S.tasks.reduce((a,t)=>a+rem(t)*t.min,0),need=days.length?remMin/days.length:Infinity;
 const warn=isT&&remMin>0&&need>S.cap?`<p class="note" role="alert"><b>Beban terlalu padat.</b> Sisa ${dur(remMin)} untuk ${days.length} hari kerja, rata-rata ${dur(need)} per hari, di atas batas ${dur(S.cap)}. Kurangi target di Brand atau naikkan batas di Atur.</p>`:'';
 let h=`<div class="top"><div class="dn"><button data-a="day" data-n="-1" aria-label="Hari kerja sebelumnya">‹</button><h1>${isT?'Hari ini':fd(sel,{weekday:'long',day:'numeric',month:'short'})}</h1><button data-a="day" data-n="1" aria-label="Hari kerja berikutnya">›</button></div>${atur}</div>`;
 h+=`<p class="mut" style="margin:-8px 0 16px 4px">${fd(sel,{weekday:'long',day:'numeric',month:'long'})}${isT?'':` · <button class="btn link" data-a="goto" data-d="${today()}">Ke hari ini</button>`}</p>`;
 if(!L.length)return h+warn+`<div class="empty"><b>Tidak ada tugas di hari ini</b><br><small>Hari kerja hanya Senin sampai Jumat. Kalau semua kuota sudah beres, selamat. Kalau belum diisi, cek tab Brand.</small></div>`;
 h+=`<div class="sum"><b>${n} dari ${L.length} tugas selesai</b><small>${p>=1?'Semua beres, silakan istirahat':'sisa '+dur(mt-md)}</small></div><div class="bar"><i style="width:${p*100}%"></i></div>`+warn;
 h+=`<ul>${[...L.filter(l=>l.d<l.q),...L.filter(l=>l.d>=l.q)].map(l=>{
  const full=l.d>=l.q,step=l.q>6?5:1;
  return`<li class="row ${full?'done':''}"><button class="ck" data-a="tick" data-id="${l.id}" aria-pressed="${full}" aria-label="Tandai ${esc(l.t.label)} ${esc(br(l.t.brand).name)}"></button><div class="grow"><b>${esc(l.t.label)}${l.q>1?' x'+l.q:''}</b><br><small>${esc(br(l.t.brand).name)} · ${dur(l.q*l.t.min)}</small></div>${l.q>1?`<div class="st"><button data-a="dec" data-id="${l.id}" data-s="${step}" aria-label="Kurangi">−</button><span>${l.d}/${l.q}</span><button data-a="inc" data-id="${l.id}" data-s="${step}" aria-label="Tambah">+</button></div>`:''}</li>`}).join('')}</ul>
 <p style="margin:16px 0 0"><button class="btn link" data-a="tab" data-k="brand">Sesuaikan tugas</button></p>`;
 return h;
}
function vMonth(){
 const days=workdays(S.month,S.month+'-01'),t0=today();
 const ds=msel&&days.includes(msel)?msel:(days.includes(t0)?t0:days[0]);
 const W=S.tasks.reduce((a,t)=>a+t.target*t.min,0),Dn=S.tasks.reduce((a,t)=>a+Math.min(doneTot(t.id),t.target)*t.min,0),pc=W?Math.round(Dn/W*100):0;
 const cells=Array(days.length?(new Date(days[0]+'T00:00:00').getDay()+6)%7:0).fill('<div></div>');
 days.forEach(d=>{
  const L=lines(d),m=L.reduce((a,l)=>a+l.q*l.t.min,0),dn=L.reduce((a,l)=>a+Math.min(l.d,l.q)*l.t.min,0),over=m>S.cap,miss=d<t0&&L.some(l=>l.d<l.q);
  cells.push(`<button class="cell${d===t0?' now':''}${d===ds?' sel':''}${over?' over':''}${miss?' miss':''}${d<t0?' off':''}" data-a="msel" data-d="${d}" aria-label="${fd(d,{weekday:'long',day:'numeric',month:'long'})}, ${L.length?dur(m)+' beban, '+dur(dn)+' selesai':'kosong'}"><i class="p" style="height:${Math.min(100,m/S.cap*100)}%"></i><i class="d" style="height:${Math.min(100,dn/S.cap*100)}%"></i><span class="n">${+d.slice(8)}</span><small>${L.length?dur(m):''}</small></button>`);
 });
 const L=lines(ds),tot=L.reduce((a,l)=>a+l.q*l.t.min,0);
 return`<div class="top"><h1>${fd(S.month+'-01',{month:'long',year:'numeric'})}</h1>${atur}</div>
 <div class="between" style="align-items:flex-end"><div><div class="big">${pc}%</div><small>selesai bulan ini</small></div><small style="text-align:right">sisa ${dur(W-Dn)}<br>${workdays(S.month,t0).length} hari kerja lagi</small></div>
 <div class="bar" style="margin-top:12px"><i style="width:${pc}%"></i></div>
 <div class="wk h" aria-hidden="true">${['Sen','Sel','Rab','Kam','Jum'].map(x=>`<small class="mut">${x}</small>`).join('')}</div>
 <div class="wk">${cells.join('')}</div>
 <div class="lg mut"><small class="mut" style="display:contents"><span><i style="background:var(--tint)"></i>beban</span><span><i style="background:var(--tint2)"></i>selesai</span><span><i style="background:var(--over)"></i>melebihi batas</span><span><i style="border:1px dashed var(--mut)"></i>tertinggal</span></small></div>
 <div class="card"><div class="between" style="margin-bottom:6px"><div><b>${fd(ds,{weekday:'long',day:'numeric',month:'long'})}</b><br><small>${L.length?L.length+' tugas, '+dur(tot):'Tidak ada tugas'}</small></div><button class="btn" data-a="goto" data-d="${ds}">Buka</button></div>
 ${L.length?`<ul class="dl">${L.map(l=>`<li class="${l.d>=l.q?'ok':''}"><span><b>${esc(l.t.label)}${l.q>1?' x'+l.q:''}</b> <small>${esc(br(l.t.brand).name)}</small></span><small>${l.d>=l.q?'selesai':l.d+'/'+l.q}</small></li>`).join('')}</ul>`:''}</div>`;
}
function vBrand(){
 return`<div class="top"><h1>Brand</h1>${atur}</div><p class="mut" style="margin-top:-8px">Ketuk brand untuk mengubah target atau mengisi progress yang tertinggal. Jadwal disusun ulang otomatis dari sisa tugas.</p><ul>`+S.brands.map(b=>{
  const ts=S.tasks.filter(t=>t.brand===b.id),w=work(b),dn=ts.reduce((a,t)=>a+Math.min(doneTot(t.id),t.target)*t.min,0),f=feeOf(b);
  return`<li><button class="day" data-a="brand" data-id="${b.id}"><div class="between"><b>${esc(b.name)}</b><span>${f?rp(f):'Tanpa fee'}</span></div><div class="bar"><i style="width:${w?dn/w*100:0}%"></i></div><small>${ts.map(t=>esc(t.label)+' '+Math.min(doneTot(t.id),t.target)+'/'+t.target).join(' · ')||'Belum ada tugas'}</small>${f&&w?`<br><small>Setara ${rp(f/(w/60))} per jam kerja</small>`:''}<div style="height:10px"></div></button></li>`}).join('')+`</ul><p style="margin-top:16px"><button class="btn alt" data-a="addbrand">Tambah brand</button></p>`;
}
function setHTML(){
 return`<div class="between" style="margin-bottom:12px"><h2>Atur</h2><button class="btn alt" data-a="closedlg">Selesai</button></div>
 <div class="f"><label for="cap">Batas beban per hari (menit)</label><input id="cap" type="number" inputmode="numeric" min="30" value="${S.cap}"><small>Jam kerja 9 sampai 17 itu 480 menit. Default 360 menyisakan ruang istirahat dan revisi.</small></div>
 <div class="f"><label for="pf">Total fee ${esc(S.pools.A.name)} (Rp)</label><input id="pf" type="number" inputmode="numeric" min="0" value="${S.pools.A.fee}"><small>Dibagi otomatis ke brand yang memakai paket agensi, sesuai beban kerjanya.</small></div>
 <p><button class="btn alt" data-a="replan">Susun ulang jadwal dari sisa tugas</button></p>
 <p><button class="btn alt" data-a="newmonth">Mulai bulan baru</button></p>
 <p class="mut">${local?'Mode lokal: data hanya di perangkat ini.':'Masuk sebagai '+esc(email)+'<br>Ruang: '+esc(room)}</p>
 <button class="btn alt" data-a="logout">Keluar</button>`;
}
function render(){
 if(!S)return;
 $('#v').innerHTML={today:vToday,month:vMonth,brand:vBrand}[tab]();
 const IC={today:'<circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16 9.5"/>',month:'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>',brand:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a1 1 0 011-1h4a1 1 0 011 1v2M3 13h18"/>'};
 $('#nav').innerHTML=[['today','Hari ini'],['month','Bulan'],['brand','Brand']].map(([k,l])=>`<button data-a="tab" data-k="${k}" aria-label="${l}" title="${l}" ${tab===k?'aria-current="page"':''}><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[k]}</svg></button>`).join('');
}
function fillBrand(){
 const b=br(cur),ft=b.pool?'pool':(b.fee?'fixed':'none');
 $('#dlg').innerHTML=`<div class="between" style="margin-bottom:12px"><h2>Atur brand</h2><button class="btn alt" data-a="closedlg">Selesai</button></div>
 <div class="f"><label for="bn">Nama brand</label><input id="bn" data-f="name" value="${esc(b.name)}"></div>
 <div class="f"><label for="bf">Fee</label><select id="bf" data-f="ftype"><option value="none" ${ft==='none'?'selected':''}>Tanpa fee (bisnis sendiri)</option><option value="fixed" ${ft==='fixed'?'selected':''}>Fee tetap</option><option value="pool" ${ft==='pool'?'selected':''}>Bagian dari paket agensi</option></select></div>
 ${ft==='fixed'?`<div class="f"><label for="bfx">Fee per bulan (Rp)</label><input id="bfx" type="number" inputmode="numeric" data-f="fee" value="${b.fee||0}"></div>`:''}
 <h3 style="margin:8px 0">Tugas bulan ini</h3>
 ${S.tasks.filter(t=>t.brand===cur).map(t=>`<div class="tr" data-t="${t.id}"><div class="f"><label>Nama tugas</label><input data-f="label" value="${esc(t.label)}"></div><div class="g3"><div class="f"><label>Target</label><input type="number" inputmode="decimal" min="0" data-f="target" value="${t.target}"></div><div class="f"><label>Sudah selesai</label><input type="number" inputmode="decimal" min="0" data-f="done" value="${doneTot(t.id)}"></div><div class="f"><label>Menit/unit</label><input type="number" inputmode="decimal" min="0" step="0.5" data-f="min" value="${t.min}"></div></div><button class="btn alt" data-a="deltask" data-id="${t.id}">Hapus tugas</button></div>`).join('')||'<p class="mut">Belum ada tugas. Tambahkan di bawah.</p>'}
 <div class="between" style="gap:8px"><select id="np" aria-label="Jenis tugas baru">${Object.keys(PRESET).map(k=>`<option>${k}</option>`).join('')}</select><button class="btn sun" data-a="addtask">Tambah</button></div>
 <p style="margin-top:16px"><button class="btn alt" data-a="delbrand">Hapus brand ini</button></p>`;
}
function openBrand(id){cur=id;fillBrand();$('#dlg').showModal()}

/* ---------- aksi ---------- */
function setDone(id,n,max){S.done[sel]=S.done[sel]||{};S.done[sel][id]=Math.max(0,Math.min(max,n));save();render()}
function step(s,n){const d=new Date(s+'T00:00:00');do d.setDate(d.getDate()+n);while([0,6].includes(d.getDay()));return iso(d)}
const A={
 tab(e){tab=e.k;render();scrollTo(0,0)},
 msel(e){msel=e.d;render()},
 settings(){$('#dlg').innerHTML=setHTML();$('#dlg').showModal()},
 goto(e){sel=e.d;tab='today';render();scrollTo(0,0)},
 day(e){const s=step(sel,+e.n);if(s.slice(0,7)===S.month){sel=s;render()}else toast('Rencana hanya untuk bulan berjalan.')},
 tick(e){const l=lines(sel).find(x=>x.id===e.id);setDone(e.id,l.d>=l.q?0:l.q,l.q)},
 inc(e){const l=lines(sel).find(x=>x.id===e.id);setDone(e.id,l.d+ +e.s,l.q)},
 dec(e){const l=lines(sel).find(x=>x.id===e.id);setDone(e.id,l.d- +e.s,l.q)},
 brand(e){openBrand(e.id)},
 addbrand(){const id='b'+Date.now();S.brands.push({id,name:'Brand baru',c:'#4D96FF',pool:'',fee:0});save();openBrand(id)},
 closedlg(){$('#dlg').close()},
 addtask(){const l=$('#np').value;S.tasks.push({id:'t'+Date.now(),brand:cur,label:l,target:1,min:PRESET[l]});save();fillBrand()},
 deltask(e){if(confirm('Hapus tugas ini dari bulan ini?')){S.tasks=S.tasks.filter(t=>t.id!==e.id);save();fillBrand()}},
 delbrand(){if(confirm('Hapus brand ini beserta semua tugasnya?')){S.tasks=S.tasks.filter(t=>t.brand!==cur);S.brands=S.brands.filter(b=>b.id!==cur);$('#dlg').close()}},
 replan(){if($('#dlg').open)$('#dlg').close();replan();save();toast('Jadwal disusun ulang dari sisa tugas.');tab='today';sel=today();render()},
 newmonth(){if(confirm('Kosongkan progress dan mulai bulan baru?')){if($('#dlg').open)$('#dlg').close();newMonth();save();tab='today';sel=today();render();toast('Bulan baru siap.')}},
 logout(){if(local){try{localStorage.removeItem('swipi_mode')}catch(e){}location.reload()}else auth.signOut().then(()=>location.reload())},
 local(){lset('swipi_mode','local');location.reload()},
 login(){
  const e=$('#em').value.trim(),p=$('#pw').value,r=cleanRoom($('#rm').value),er=$('#autherr');er.textContent='';
  if(!e||!p||!r){er.textContent='Isi email, kata sandi, dan kode ruang.';return}
  if(r.length<3){er.textContent='Kode ruang minimal 3 karakter (huruf, angka, - atau _).';return}
  if(!auth){er.textContent='Firebase belum diisi di file ini.';return}
  lset('swipi_room',r);$('#rm').value=r;
  auth.signOut().then(()=>auth.signInWithEmailAndPassword(e,p)).catch(x=>{
   er.textContent={'auth/invalid-credential':'Email atau kata sandi salah.','auth/invalid-email':'Format email belum benar.','auth/too-many-requests':'Terlalu banyak percobaan. Coba lagi beberapa menit lagi.','auth/network-request-failed':'Tidak ada koneksi internet.'}[x.code]||'Gagal masuk: '+x.code;
  });
 }
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset)});
document.addEventListener('input',e=>{
 const i=e.target;
 if(i.id==='cap'){S.cap=Math.max(30,+i.value||360);save();return}
 if(i.id==='pf'){S.pools.A.fee=+i.value||0;save();return}
 const f=i.dataset.f;if(!f||!S)return;
 const row=i.closest('[data-t]'),b=br(cur);
 if(row){const t=tk(row.dataset.t),v=i.type==='number'?Math.max(0,+i.value||0):i.value;if(f==='done')S.base[t.id]=v-logs(t.id);else t[f]=v}
 else if(f==='ftype')return;else b[f]=f==='fee'?(+i.value||0):i.value;
 save();
});
document.addEventListener('change',e=>{
 const i=e.target;if(i.dataset.f!=='ftype')return;
 const b=br(cur);if(i.value==='none'){b.pool='';b.fee=0}else if(i.value==='fixed'){b.pool=''}else{b.pool='A';b.fee=0}
 save();fillBrand();
});
$('#dlg').addEventListener('close',()=>{replan();save();render()});
let tx=0,ty=0;
$('#v').addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
$('#v').addEventListener('touchend',e=>{if(tab!=='today')return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)>70&&Math.abs(dy)<40)A.day({n:dx<0?1:-1})},{passive:true});
document.addEventListener('focusin',e=>{if(e.target.type==='number')e.target.select()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.closest('#auth')&&e.target.tagName==='INPUT')A.login()});

/* ---------- mulai ---------- */
function init(){
 if(!S){S=defaults();replan();save()}
 S.pools=S.pools||{A:{name:'Paket agensi',fee:0}};S.base=S.base||{};S.done=S.done||{};S.plan=S.plan||{};
 if(S.month!==today().slice(0,7)){newMonth();save();toast('Bulan baru dimulai, progress dikosongkan.')}
 else if(S.gen!==today()){
  const late=Object.keys(S.plan).filter(d=>d<today()).reduce((a,d)=>a+lines(d).filter(l=>l.d<l.q).length,0);
  replan();save();if(late)toast(late+' tugas yang tertinggal sudah digeser ke hari kerja berikutnya.');
 }
 sel=today();if(![1,2,3,4,5].includes(new Date().getDay())){const d=workdays(S.month,today())[0];if(d)sel=d}
 show('app');render();
}
let unsub=null;
function enter(u){
 email=u.email;room=cleanRoom(ls('swipi_room'));
 if(!room){auth.signOut();return}
 if(unsub)unsub();
 ref=db.collection('ruang').doc(room);let first=true;
 unsub=ref.onSnapshot(s=>{
  if(s.metadata.hasPendingWrites)return;
  S=s.exists?s.data():null;
  if(first||!S){first=false;init()}else render();
 },err=>{show('app');toast('Tidak bisa membaca data: '+err.code+'. Cek aturan Firestore.')});
}
function boot(){
 if(ls('swipi_mode')==='local'){local=true;try{S=JSON.parse(ls('swipi_local')||'null')}catch(e){S=null}init();return}
 const c=FIREBASE_CONFIG;
 if(typeof firebase==='undefined'||/^ISI/.test(c.apiKey)){
  show('auth');$('#autherr').textContent=typeof firebase==='undefined'?'Firebase gagal dimuat. Cek internet lalu muat ulang.':'Firebase belum diisi di file ini.';return;
 }
 firebase.initializeApp(c);auth=firebase.auth();db=firebase.firestore();
 auth.onAuthStateChanged(u=>{if(!u){show('auth');return}enter(u)});
}
boot();
</script>
</body></html>
